services:
  - type: web
    name: site-cloner
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 300 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_USER
        value: admin
      - key: APP_PASSWORD
        generateValue: true
