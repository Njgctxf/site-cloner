<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Boutique{% endblock %}</title>
  <style>
    :root { --bg:#090a0f; --card:#121420; --border:#1e2238; --accent:#6366f1; --text:#f8fafc; --muted:#94a3b8; --danger:#ef4444; --ok:#10b981; }
    * { box-sizing:border-box; margin:0; padding:0; font-family:Inter,system-ui,sans-serif; }
    body { background:var(--bg); color:var(--text); min-height:100vh; }
    a { color:inherit; }
    header { display:flex; justify-content:space-between; align-items:center; padding:16px 24px; border-bottom:1px solid var(--border); }
    header a { text-decoration:none; font-weight:700; }
    main { max-width:1000px; margin:0 auto; padding:32px 16px 64px; }
    h1 { font-size:1.6rem; margin-bottom:6px; }
    .sub { color:var(--muted); margin-bottom:24px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden; text-decoration:none; display:flex; flex-direction:column; transition:transform .15s, border-color .15s; }
    .card:hover { transform:translateY(-3px); border-color:var(--accent); }
    .card img, .ph { width:100%; aspect-ratio:16/10; object-fit:cover; background:linear-gradient(135deg,#1e2238,#2a1f3d); display:block; }
    .card .body { padding:14px 16px 16px; display:flex; flex-direction:column; gap:6px; }
    .card h2 { font-size:1rem; }
    .price { color:#a5b4fc; font-weight:700; }
    .btn { background:var(--accent); color:#fff; border:0; border-radius:10px; padding:11px 18px; font-weight:600; font-size:.95rem; cursor:pointer; text-decoration:none; display:inline-block; }
    .btn.ghost { background:transparent; border:1px solid var(--border); }
    .btn:hover { filter:brightness(1.1); }
    .empty { color:var(--muted); text-align:center; padding:60px 0; }
    .err { color:var(--danger); margin-bottom:12px; }
    input[type=email] { background:#0b0d16; border:1px solid var(--border); color:var(--text); border-radius:10px; padding:11px 12px; font-size:.95rem; width:100%; max-width:320px; }
  </style>
</head>
<body>
  <header><a href="/shop/">⚡ Boutique</a></header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
