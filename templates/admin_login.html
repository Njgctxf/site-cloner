<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Admin - Connexion</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/__sc/static/ui.css">
  <style>
    body.ui { display: grid; place-items: center; padding: 16px; }
    form { width: 100%; max-width: 380px; padding: 32px; display: flex; flex-direction: column; gap: 14px; }
  </style>
</head>
<body class="ui">
  <form method="post" autocomplete="on" class="ui-card ui-border-glow" data-reveal="zoom">
    <div class="ui-brand"><img class="rx-orb" src="/__sc/static/reflex/img/brand-orbit.svg" alt=""><span>SiteCloner</span> <span class="ui-badge accent">Admin</span></div>
    <p class="ui-muted" style="margin:0 0 6px;font-size:.9rem">Connecte-toi pour gérer la plateforme.</p>
    {% if error %}<div class="ui-badge danger" style="padding:8px 12px" role="alert">{{ error }}</div>{% endif %}
    <div><label class="ui-label">Identifiant</label><input class="ui-input" name="username" autocomplete="username" required autofocus></div>
    <div><label class="ui-label">Mot de passe</label><input class="ui-input" name="password" type="password" autocomplete="current-password" required></div>
    <button class="ui-btn primary" type="submit" style="margin-top:6px">Se connecter</button>
  </form>
  <script src="/__sc/static/ui.js"></script>
</body>
</html>
